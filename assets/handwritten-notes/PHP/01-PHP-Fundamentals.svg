<text x="70" y="120" font-family="Comic Sans MS, cursive" font-size="48" font-weight="bold">① PHP — FUNDAMENTALS + INTERVIEW + MACHINE ROUND</text>
<text x="70" y="175" font-family="Comic Sans MS, cursive" font-size="26" fill="#8b1e1e">0–5 YOE • CORE REVISION SHEET</text>
<line x1="60" y1="205" x2="1740" y2="205" stroke="#555" stroke-width="2"/>
<rect x="60" y="235" width="810" height="930" rx="20" fill="none" stroke="#555" stroke-width="2"/>
<text x="85" y="285" font-family="Comic Sans MS, cursive" font-size="34" font-weight="bold" fill="#8b1e1e">PHP BASICS</text>
<g font-family="Comic Sans MS, cursive" font-size="25">
<text x="90" y="330">• PHP execution model + request/response</text><text x="90" y="365">• Syntax, variables, constants</text><text x="90" y="400">• Scalar: int, float, string, bool</text><text x="90" y="435">• Compound: array, object</text><text x="90" y="470">• null + resources + callable</text><text x="90" y="505">• == vs === • != vs !==</text><text x="90" y="540">• Truthy / falsy values</text><text x="90" y="575">• Operators: arithmetic, assignment, comparison</text><text x="90" y="610">• logical, bitwise, null coalescing</text><text x="90" y="645">• if / elseif / else • switch • match</text><text x="90" y="680">• for / while / do-while / foreach</text><text x="90" y="715">• break / continue</text><text x="90" y="750">• Functions, parameters, return types</text><text x="90" y="785">• default / variadic / named arguments</text><text x="90" y="820">• pass by value vs reference</text><text x="90" y="855">• type declarations + strict_types</text><text x="90" y="890">• anonymous functions + closures</text><text x="90" y="925">• arrow functions</text><text x="90" y="960">• arrays: indexed / associative / multidimensional</text><text x="90" y="995">• array_map / filter / reduce / sort</text><text x="90" y="1030">• string functions + interpolation</text><text x="90" y="1065">• superglobals: $_GET $_POST $_SERVER $_SESSION</text><text x="90" y="1100">• cookies, sessions, headers, output buffering</text><text x="90" y="1135">• include / require / *_once</text>
</g>
<rect x="900" y="235" width="840" height="930" rx="20" fill="none" stroke="#555" stroke-width="2"/>
<text x="925" y="285" font-family="Comic Sans MS, cursive" font-size="34" font-weight="bold" fill="#8b1e1e">INTERVIEW HOTSPOTS</text>
<g font-family="Comic Sans MS, cursive" font-size="25">
<text x="930" y="330">1. What happens when a PHP request reaches the server?</text><text x="930" y="375">2. == vs === with tricky examples?</text><text x="930" y="420">3. What are PHP's falsy values?</text><text x="930" y="465">4. include vs require vs *_once?</text><text x="930" y="510">5. pass-by-value vs pass-by-reference?</text><text x="930" y="555">6. Closure vs normal function?</text><text x="930" y="600">7. What is strict_types and why use it?</text><text x="930" y="645">8. How do sessions work?</text><text x="930" y="690">9. GET vs POST + security implications?</text><text x="930" y="735">10. What are superglobals?</text><text x="930" y="780">11. What is output buffering?</text><text x="930" y="825">12. How does variable scope work?</text><text x="930" y="870">13. array_map vs foreach?</text><text x="930" y="915">14. How does PHP handle type juggling?</text><text x="930" y="960">15. What changed in modern PHP 8.x?</text><text x="930" y="1005">16. How do you prevent SQL injection?</text><text x="930" y="1050">17. How do you safely handle uploaded files?</text><text x="930" y="1095">18. How do exceptions differ from errors?</text><text x="930" y="1140">19. What causes memory exhaustion?</text>
</g>
<rect x="60" y="1210" width="1680" height="500" rx="20" fill="none" stroke="#555" stroke-width="2"/>
<text x="85" y="1260" font-family="Comic Sans MS, cursive" font-size="34" font-weight="bold" fill="#166534">MACHINE ROUND — PRACTICE</text>
<g font-family="Comic Sans MS, cursive" font-size="25">
<text x="90" y="1310">① Write a function to find the second-largest unique number in an array.</text><text x="90" y="1355">② Remove duplicate values while preserving first-seen order.</text><text x="90" y="1400">③ Count word frequency in a string, case-insensitively.</text><text x="90" y="1445">④ Find the first non-repeating character.</text><text x="90" y="1490">⑤ Implement array grouping by a chosen key.</text><text x="90" y="1535">⑥ Validate nested request data and return structured errors.</text><text x="90" y="1580">⑦ Build a safe DB query using PDO prepared statements.</text><text x="90" y="1625">⑧ Create a simple session-based login flow.</text><text x="90" y="1670">⑨ Debug a script with an unexpected type-juggling result.</text>
</g>
<rect x="60" y="1760" width="1680" height="570" rx="20" fill="none" stroke="#555" stroke-width="2"/>
<text x="85" y="1810" font-family="Comic Sans MS, cursive" font-size="34" font-weight="bold" fill="#8b1e1e">INTERVIEW TRAPS / PRODUCTION THINKING</text>
<g font-family="Comic Sans MS, cursive" font-size="25">
<text x="90" y="1860">• Never rely on loose comparison for authorization or security decisions.</text><text x="90" y="1905">• Validate and normalize external input before business logic.</text><text x="90" y="1950">• Prepared statements protect SQL structure; validation still matters.</text><text x="90" y="1995">• Sessions need secure cookie settings and sensible expiry.</text><text x="90" y="2040">• Avoid leaking stack traces, SQL errors or secrets to users.</text><text x="90" y="2085">• Know the difference between language feature knowledge and framework knowledge.</text><text x="90" y="2130">• For 3–5 YOE, explain trade-offs, failure modes and testing—not only syntax.</text><text x="90" y="2175">• Be ready to read unfamiliar PHP code and predict its output.</text><text x="90" y="2220">• Be ready to refactor procedural code into testable, maintainable units.</text><text x="90" y="2265">• Always connect answers to real production experience when possible.</text>
</g>
<text x="70" y="2370" font-family="Comic Sans MS, cursive" font-size="22" fill="#555">Companion to PHP Markdown notes • zoomable SVG • handwritten-study style</text>
</svg>