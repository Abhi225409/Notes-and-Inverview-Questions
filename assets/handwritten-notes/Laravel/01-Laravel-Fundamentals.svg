<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2400" viewBox="0 0 1800 2400"><rect width="1800" height="2400" fill="#fffdf7"/><text x="70" y="120" font-family="Comic Sans MS,cursive" font-size="48" font-weight="bold">② LARAVEL — FUNDAMENTALS + INTERVIEW + MACHINE ROUND</text><text x="70" y="175" font-family="Comic Sans MS,cursive" font-size="26" fill="#8b1e1e">0–5 YOE • CORE REVISION SHEET</text><line x1="60" y1="205" x2="1740" y2="205" stroke="#555" stroke-width="2"/><rect x="60" y="235" width="810" height="980" rx="20" fill="none" stroke="#555" stroke-width="2"/><text x="85" y="285" font-family="Comic Sans MS,cursive" font-size="34" font-weight="bold" fill="#8b1e1e">LARAVEL CORE</text><g font-family="Comic Sans MS,cursive" font-size="25"><text x="90" y="330">• MVC + project structure + configuration</text><text x="90" y="370">• Request → HTTP Kernel → middleware → controller → response</text><text x="90" y="410">• Routing, route groups, named routes, model binding</text><text x="90" y="450">• Controllers + resource controllers + dependency injection</text><text x="90" y="490">• Middleware: global / route / terminable</text><text x="90" y="530">• Service Container + bindings + contextual binding</text><text x="90" y="570">• Service Providers + boot/register</text><text x="90" y="610">• Facades + contracts</text><text x="90" y="650">• Configuration + environment + caching config</text><text x="90" y="690">• Blade: layouts, components, directives, escaping</text><text x="90" y="730">• Validation + Form Requests + custom rules</text><text x="90" y="770">• Eloquent models + relationships + scopes + casts</text><text x="90" y="810">• Query Builder + raw queries</text><text x="90" y="850">• Migrations + seeders + factories</text><text x="90" y="890">• Authentication + authorization + gates + policies</text><text x="90" y="930">• Events/listeners + jobs/queues + scheduler</text><text x="90" y="970">• Cache + sessions + files/storage</text><text x="90" y="1010">• API Resources + Sanctum/token authentication</text><text x="90" y="1050">• Mail + notifications + logging</text><text x="90" y="1090">• Testing: unit / feature / HTTP / database</text><text x="90" y="1130">• Performance + security + deployment basics</text><text x="90" y="1170">• Version-specific features must be checked against target Laravel version.</text></g><rect x="900" y="235" width="840" height="980" rx="20" fill="none" stroke="#555" stroke-width="2"/><text x="925" y="285" font-family="Comic Sans MS,cursive" font-size="34" font-weight="bold" fill="#8b1e1e">INTERVIEW HOTSPOTS</text><g font-family="Comic Sans MS,cursive" font-size="25"><text x="930" y="330">1. Explain Laravel request lifecycle.</text><text x="930" y="375">2. Service Container vs Service Provider?</text><text x="930" y="420">3. Facade vs dependency injection?</text><text x="930" y="465">4. Route model binding: implicit vs explicit?</text><text x="930" y="510">5. Middleware execution order?</text><text x="930" y="555">6. Eloquent vs Query Builder?</text><text x="930" y="600">7. Lazy vs eager loading + N+1 problem?</text><text x="930" y="645">8. hasOne / hasMany / belongsTo / belongsToMany?</text><text x="930" y="690">9. Jobs vs events vs listeners?</text><text x="930" y="735">10. Queue retry, timeout and failed jobs?</text><text x="930" y="780">11. Gates vs policies?</text><text x="930" y="825">12. Transactions and rollback strategy?</text><text x="930" y="870">13. Cache drivers and invalidation?</text><text x="930" y="915">14. Sanctum/API authentication?</text><text x="930" y="960">15. Form Request validation?</text><text x="930" y="1005">16. How would you optimize a slow Laravel endpoint?</text><text x="930" y="1050">17. How do you prevent mass assignment?</text><text x="930" y="1095">18. How do you test controllers/services?</text><text x="930" y="1140">19. How do you structure a large Laravel application?</text></g><rect x="60" y="1260" width="1680" height="520" rx="20" fill="none" stroke="#555" stroke-width="2"/><text x="85" y="1310" font-family="Comic Sans MS,cursive" font-size="34" font-weight="bold" fill="#166534">MACHINE ROUND — PRACTICE</text><g font-family="Comic Sans MS,cursive" font-size="25"><text x="90" y="1360">① Build CRUD with validation, authorization and tests.</text><text x="90" y="1405">② Build a REST API with authentication, pagination and API Resources.</text><text x="90" y="1450">③ Model a one-to-many and many-to-many relationship.</text><text x="90" y="1495">④ Diagnose and fix an N+1 query.</text><text x="90" y="1540">⑤ Move slow work into a queue with retry/failure handling.</text><text x="90" y="1585">⑥ Implement an idempotent webhook endpoint.</text><text x="90" y="1630">⑦ Design a service class and inject dependencies through the container.</text><text x="90" y="1675">⑧ Add feature tests for an authenticated endpoint.</text><text x="90" y="1720">⑨ Optimize a slow query and explain the index choice.</text><text x="90" y="1765">⑩ Design a clean module boundary for a growing Laravel application.</text></g><rect x="60" y="1830" width="1680" height="470" rx="20" fill="none" stroke="#555" stroke-width="2"/><text x="85" y="1880" font-family="Comic Sans MS,cursive" font-size="34" font-weight="bold" fill="#8b1e1e">3–5 YOE — PRODUCTION THINKING</text><g font-family="Comic Sans MS,cursive" font-size="25"><text x="90" y="1930">• Explain trade-offs, not only framework syntax.</text><text x="90" y="1975">• Know where business logic belongs: controller vs service/domain layer.</text><text x="90" y="2020">• Think about transactions, concurrency and duplicate requests.</text><text x="90" y="2065">• Think about N+1, indexes, queue backlogs and cache invalidation.</text><text x="90" y="2110">• Secure input, authorization, secrets, file uploads and webhooks.</text><text x="90" y="2155">• Explain testing strategy and observability.</text><text x="90" y="2200">• Be able to debug production failures from logs and metrics.</text><text x="90" y="2245">• Be ready to explain why you chose Laravel features in real projects.</text></g><text x="70" y="2370" font-family="Comic Sans MS,cursive" font-size="22" fill="#555">Companion to Laravel Markdown notes • zoomable SVG • handwritten-study style</text></svg>