<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2400" viewBox="0 0 1800 2400"><rect width="1800" height="2400" fill="#fffdf7"/><text x="70" y="120" font-family="Comic Sans MS,cursive" font-size="48" font-weight="bold">③ MySQL — SQL FUNDAMENTALS + INTERVIEW + MACHINE ROUND</text><text x="70" y="175" font-family="Comic Sans MS,cursive" font-size="26" fill="#8b1e1e">0–5 YOE • CORE REVISION SHEET</text><line x1="60" y1="205" x2="1740" y2="205" stroke="#555" stroke-width="2"/><rect x="60" y="235" width="810" height="1000" rx="20" fill="none" stroke="#555" stroke-width="2"/><text x="85" y="285" font-family="Comic Sans MS,cursive" font-size="34" font-weight="bold" fill="#8b1e1e">SQL CORE</text><g font-family="Comic Sans MS,cursive" font-size="25"><text x="90" y="330">• Database / table / row / column</text><text x="90" y="370">• DDL: CREATE, ALTER, DROP, TRUNCATE</text><text x="90" y="410">• DML: INSERT, UPDATE, DELETE</text><text x="90" y="450">• SELECT + WHERE + ORDER BY + LIMIT</text><text x="90" y="490">• DISTINCT + aliases</text><text x="90" y="530">• NULL: IS NULL / IS NOT NULL</text><text x="90" y="570">• LIKE / BETWEEN / IN / NOT IN</text><text x="90" y="610">• Aggregate: COUNT SUM AVG MIN MAX</text><text x="90" y="650">• GROUP BY + HAVING</text><text x="90" y="690">• INNER / LEFT / RIGHT / CROSS / SELF JOIN</text><text x="90" y="730">• Subqueries + correlated subqueries</text><text x="90" y="770">• UNION vs UNION ALL</text><text x="90" y="810">• CASE + IF + COALESCE</text><text x="90" y="850">• CTEs + window functions</text><text x="90" y="890">• PRIMARY KEY / FOREIGN KEY / UNIQUE</text><text x="90" y="930">• NOT NULL / CHECK / DEFAULT</text><text x="90" y="970">• Transactions: COMMIT / ROLLBACK</text><text x="90" y="1010">• ACID + isolation levels + locks</text><text x="90" y="1050">• Indexes + EXPLAIN + query optimization</text><text x="90" y="1090">• Normalization + denormalization</text><text x="90" y="1130">• InnoDB basics + MVCC concepts</text><text x="90" y="1170">• Backup, replication and production basics</text></g><rect x="900" y="235" width="840" height="1000" rx="20" fill="none" stroke="#555" stroke-width="2"/><text x="925" y="285" font-family="Comic Sans MS,cursive" font-size="34" font-weight="bold" fill="#8b1e1e">INTERVIEW HOTSPOTS</text><g font-family="Comic Sans MS,cursive" font-size="25"><text x="930" y="330">1. DELETE vs TRUNCATE vs DROP?</text><text x="930" y="375">2. WHERE vs HAVING?</text><text x="930" y="420">3. INNER JOIN vs LEFT JOIN?</text><text x="930" y="465">4. UNION vs UNION ALL?</text><text x="930" y="510">5. Primary key vs unique key?</text><text x="930" y="555">6. What is an index and when can it hurt?</text><text x="930" y="600">7. Clustered vs secondary index concepts?</text><text x="930" y="645">8. Composite index and leftmost-prefix idea?</text><text x="930" y="690">9. How do you read EXPLAIN?</text><text x="930" y="735">10. What is normalization?</text><text x="930" y="780">11. What is a transaction?</text><text x="930" y="825">12. Explain ACID.</text><text x="930" y="870">13. Isolation levels + dirty/non-repeatable/phantom reads?</text><text x="930" y="915">14. Deadlock: why and how to reduce it?</text><text x="930" y="960">15. CTE vs subquery?</text><text x="930" y="1005">16. Window function use cases?</text><text x="930" y="1050">17. How do you optimize a slow query?</text><text x="930" y="1095">18. How does MySQL execute a query?</text><text x="930" y="1140">19. Why can SELECT * be undesirable?</text></g><rect x="60" y="1280" width="1680" height="520" rx="20" fill="none" stroke="#555" stroke-width="2"/><text x="85" y="1330" font-family="Comic Sans MS,cursive" font-size="34" font-weight="bold" fill="#166534">MACHINE ROUND — PRACTICE</text><g font-family="Comic Sans MS,cursive" font-size="25"><text x="90" y="1380">① Find the second-highest salary without LIMIT tricks.</text><text x="90" y="1425">② Find duplicate records and then remove duplicates safely.</text><text x="90" y="1470">③ Find employees who joined in the last 30 days.</text><text x="90" y="1515">④ Find top 3 salaries per department.</text><text x="90" y="1560">⑤ Find users with no orders.</text><text x="90" y="1605">⑥ Find the latest order for every customer.</text><text x="90" y="1650">⑦ Convert a slow correlated query into a join/CTE/window solution.</text><text x="90" y="1695">⑧ Design indexes for a real API query and justify column order.</text><text x="90" y="1740">⑨ Diagnose a deadlock scenario and propose changes.</text><text x="90" y="1785">⑩ Read EXPLAIN and identify the likely bottleneck.</text></g><rect x="60" y="1850" width="1680" height="430" rx="20" fill="none" stroke="#555" stroke-width="2"/><text x="85" y="1900" font-family="Comic Sans MS,cursive" font-size="34" font-weight="bold" fill="#8b1e1e">3–5 YOE — PRODUCTION THINKING</text><g font-family="Comic Sans MS,cursive" font-size="25"><text x="90" y="1950">• Always reason about data correctness before raw speed.</text><text x="90" y="1995">• Index for real access patterns; measure with EXPLAIN.</text><text x="90" y="2040">• Understand transaction boundaries and concurrency.</text><text x="90" y="2085">• Avoid long transactions when possible.</text><text x="90" y="2130">• Know when denormalization or caching is justified.</text><text x="90" y="2175">• Be able to explain a production query optimization you performed.</text><text x="90" y="2220">• Think about pagination, large tables, locks and growth.</text></g><text x="70" y="2370" font-family="Comic Sans MS,cursive" font-size="22" fill="#555">Companion to MySQL Markdown notes • zoomable SVG • handwritten-study style</text></svg>